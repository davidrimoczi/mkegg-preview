# Pages CMS editor configuration (https://pagescms.org)
# Log in at app.pagescms.org with GitHub, open this repository, and "Articles" appears.

media:
  input: src/assets/media
  output: /media

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    filename: "{primary}.md"
    view:
      fields: [title, kind, label, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: standfirst
        label: Standfirst (one or two sentences under the headline)
        type: text
        required: true
      - name: kind
        label: Kind of story
        type: select
        required: true
        default: News
        options:
          values: [News, Feature, Interview, Analysis, Opinion]
      - name: label
        label: Story label (how solid the reporting is; None = no label)
        type: select
        default: None
        options:
          values: [None, Confirmed, Report, Opinion, Rumour]
      - name: league
        label: League
        type: select
        default: LEC
        options:
          values: [LEC, LCK, LPL, LCS, First Stand, MSI, Worlds, Other]
      - name: author
        label: Author
        type: string
        default: Damilosk
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          time: true
      - name: updated
        label: Updated (only for meaningful changes after publishing)
        type: date
        options:
          time: true
      - name: readTime
        label: Read time (minutes)
        type: number
      - name: image
        label: Lead photo
        type: image
      - name: imageAlt
        label: Photo description (for screen readers)
        type: string
      - name: imageCredit
        label: Photo credit
        type: string
      - name: tags
        label: Tags (e.g. LEC, Carzzy, Movistar KOI). Each tag gets its own page
        type: string
        list: true
      - name: featured
        label: Featured (the newest featured article leads the homepage; leave it ticked so it stays in the Featured section)
        type: boolean
        default: false
      - name: rosters
        label: Roster card (optional). Add one and fill it in. It appears where you type [roster] on its own line in the article, or after the second paragraph
        type: object
        list: true
        fields:
          - name: team
            label: Team name (e.g. Dplus KIA)
            type: string
            required: true
          - name: subtitle
            label: Line under the team name (e.g. LCK 2027 roster)
            type: string
          - name: logo
            label: Team logo (optional; square works best)
            type: image
          - name: logoWhite
            label: Turn the logo white (tick this if the logo is dark and hard to see)
            type: boolean
            default: false
          - name: players
            label: Rows (one per player, top to bottom)
            type: object
            list: true
            fields:
              - name: role
                label: Role (e.g. Top)
                type: string
              - name: name
                label: Player name (e.g. Doran)
                type: string
              - name: realName
                label: Real name (optional, shown small)
                type: string
              - name: tag
                label: Tag on the right (optional, e.g. New · from T1)
                type: string
              - name: gold
                label: Gold tag (for new signings)
                type: boolean
                default: false
          - name: footLabel
            label: Bottom line label (e.g. Head coach; leave empty for no bottom line)
            type: string
          - name: footText
            label: Bottom line text (e.g. cvMax)
            type: string
      - name: draft
        label: Draft (only visible on the preview site)
        type: boolean
        default: true
      - name: body
        label: Article
        type: rich-text

