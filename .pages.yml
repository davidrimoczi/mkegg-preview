# Pages CMS editor configuration (https://pagescms.org)
# Log in at app.pagescms.org with GitHub, open this repository, and "Articles" appears.

media:
  input: src/assets/media
  output: /media

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    filename: "{primary}.md"
    view:
      fields: [title, kind, label, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: standfirst
        label: Standfirst (one or two sentences under the headline)
        type: text
        required: true
      - name: kind
        label: Kind of story
        type: select
        required: true
        default: News
        options:
          values: [News, Feature, Interview, Analysis, Opinion]
      - name: label
        label: Story label (how solid the reporting is; None = no label)
        type: select
        default: None
        options:
          values: [None, Confirmed, Report, Opinion, Rumour]
      - name: league
        label: League
        type: select
        default: LEC
        options:
          values: [LEC, LCK, LPL, LCS, First Stand, MSI, Worlds, Other]
      - name: author
        label: Author
        type: string
        default: Damilosk
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          time: true
      - name: updated
        label: Updated (only for meaningful changes after publishing)
        type: date
        options:
          time: true
      - name: readTime
        label: Read time (minutes)
        type: number
      - name: image
        label: Lead photo
        type: image
      - name: imageAlt
        label: Photo description (for screen readers)
        type: string
      - name: imageCredit
        label: Photo credit
        type: string
      - name: tags
        label: Tags (e.g. LEC, Carzzy, Movistar KOI). Each tag gets its own page
        type: string
        list: true
      - name: featured
        label: Featured (the newest featured article leads the homepage; leave it ticked so it stays in the Featured section)
        type: boolean
        default: false
      - name: rosters
        label: Roster card (optional). Pick a team; the card goes where you type [roster] on its own line, or after the second paragraph
        type: reference
        list: true
        options:
          collection: teams
          search: name
          label: "{league} · {name} {season}"
      - name: draft
        label: Draft (only visible on the preview site)
        type: boolean
        default: true
      - name: body
        label: Article
        type: rich-text

  - name: teams
    label: Teams (rosters)
    type: collection
    path: src/content/teams
    format: yaml
    filename: "{fields.name}-{fields.season}.yml"
    view:
      fields: [name, league, season]
      primary: name
      sort: [league, name]
    fields:
      - name: name
        label: Team name
        type: string
        required: true
      - name: league
        label: League
        type: select
        default: LEC
        options:
          values: [LEC, LCK, LPL, LCS, Other]
      - name: season
        label: Season
        type: string
        default: "2027"
      - name: coach
        label: Head coach
        type: string
      - name: players
        label: Players (in order Top, Jungle, Mid, ADC, Support)
        type: object
        list: true
        fields:
          - name: role
            label: Role
            type: select
            options:
              values: [Top, Jungle, Mid, ADC, Support, Sub]
          - name: name
            label: Player name (e.g. Doran)
            type: string
          - name: realName
            label: Real name (optional)
            type: string
          - name: note
            label: Short note (e.g. from T1)
            type: string
          - name: isNew
            label: New signing (gold NEW tag)
            type: boolean
            default: false
